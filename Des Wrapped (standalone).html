<style>
  :root {
    --bg: #0c0a08; --ink: #f4ece0; --cream: #efe6d5; --cream-warm: #f4ead7;
    --paper: #f8f1e2; --paper-deep: #ebdfc6; --char: #1a1612;
    --burgundy: #5a1622; --burgundy-deep: #3a0d17; --wine: #7a2230;
    --gold: #c9a55c; --gold-soft: #d4b87a; --gold-pale: #e6d4a8;
    --serif: "Cormorant Garamond", "Italiana", "Fraunces", Georgia, serif;
    --serif-alt: "Fraunces", "Cormorant Garamond", Georgia, serif;
    --sans: "DM Sans", system-ui, -apple-system, sans-serif;
    --mono: "DM Mono", "JetBrains Mono", ui-monospace, monospace;
    --grain: 0.55;
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink); font-family: var(--sans); }
  #root { position: fixed; inset: 0; overflow: hidden; }

  /* Film grain overlay */
  #grain {
    position: fixed; inset: -10%; pointer-events: none; z-index: 50;
    opacity: var(--grain); mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5 0 0 0 0 0.45 0 0 0 0 0.4 0 0 0 0.9 0'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='0.55'/></svg>");
    background-size: 320px 320px; animation: grain 1.6s steps(6) infinite;
  }
  @keyframes grain {
    0%{transform:translate(0,0)}16%{transform:translate(-3%,-2%)}33%{transform:translate(2%,-4%)}
    50%{transform:translate(-1%,3%)}66%{transform:translate(4%,1%)}83%{transform:translate(-2%,-1%)}100%{transform:translate(0,0)}
  }

  @keyframes stamp-in {
    0% { transform: translate(-50%, -50%) rotate(-18deg) scale(2.5); opacity: 0; }
    60% { transform: translate(-50%, -50%) rotate(-18deg) scale(0.9); opacity: 0.9; }
    100% { transform: translate(-50%, -50%) rotate(-18deg) scale(1); opacity: 0.85; }
  }

  .scene { position: absolute; inset: 0; overflow: hidden; display: flex; flex-direction: column; will-change: opacity, transform; }
  .full { position: absolute; inset: 0; }
  img.full { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* Progress ticks */
  .progress {
    position: fixed; top: calc(var(--sat) + 12px); left: 16px; right: 16px;
    display: flex; gap: 4px; z-index: 40; pointer-events: none;
  }
  .progress .tick { flex: 1; height: 2.5px; background: rgba(244,236,224,0.18); border-radius: 2px; overflow: hidden; }
  .progress .tick.dark { background: rgba(12,10,8,0.16); }
  .progress .tick i { display: block; height: 100%; background: currentColor; width: 0%; transition: width 200ms linear; }
  .progress .tick.done i { width: 100%; }

  /* Tap nav zones */
  .tap-zone { position: fixed; top: 0; bottom: 0; z-index: 30; }
  .tap-zone.left { left: 0; width: 30%; }
  .tap-zone.right { right: 0; width: 70%; cursor: pointer; }

  /* Audio toggle */
  #audio-toggle {
    position: fixed; bottom: calc(var(--sab, 0px) + 16px); right: 16px; z-index: 45;
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: rgba(0,0,0,0.35); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    color: #fff; cursor: pointer; display: grid; place-items: center;
    transition: opacity 300ms, background 300ms;
    opacity: 0.7;
  }
  #audio-toggle:hover { opacity: 1; background: rgba(0,0,0,0.55); }

  /* Gradient helpers */
  .grad-bottom { position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,transparent 35%,#0a0807cc 75%,#0a0807 100%); }
  .grad-top { position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,#0a0807dd 0%,transparent 35%); }
  .vignette { position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,#00000077 100%); }

  /* Typography */
  .serif { font-family: var(--serif); font-weight: 400; letter-spacing: 0.005em; }
  .serif-it { font-family: var(--serif); font-weight: 400; font-style: italic; }
  .display { font-family: var(--serif); font-weight: 400; line-height: 0.92; letter-spacing: -0.015em; }
  .mono { font-family: var(--mono); }
  .eyebrow { font-family: var(--sans); text-transform: uppercase; font-size: 11px; letter-spacing: 0.34em; font-weight: 500; opacity: 0.7; }
  .label { font-family: var(--sans); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; opacity: 0.78; }

  /* Animations */
  @keyframes fade-up { from { opacity:0; transform: translateY(18px) } to { opacity:1; transform: translateY(0) } }
  @keyframes fade-in { from { opacity:0 } to { opacity:1 } }
  @keyframes blur-in { from { filter: blur(8px); opacity:0 } to { filter: blur(0); opacity:1 } }
  @keyframes ken-burns { from { transform: scale(1.05) translate(-1%,-1%) } to { transform: scale(1.15) translate(1%,1%) } }
  @keyframes ken-pan-left { from { transform: scale(1.12) translateX(-3%) } to { transform: scale(1.15) translateX(3%) } }
  @keyframes ken-pan-up { from { transform: scale(1.15) translateY(2%) } to { transform: scale(1.18) translateY(-3%) } }
  .fade-in { animation: fade-in 800ms ease both; }
  .fade-up { animation: fade-up 900ms cubic-bezier(.2,.7,.2,1) both; }
  .blur-in { animation: blur-in 1100ms cubic-bezier(.2,.7,.2,1) both; }

  /* Splash */
  #splash { display:none; }
</style>

/* ============ PROGRESS BAR ============ */
function ProgressBar(props) {
  var chapters = props.chapters, idx = props.idx, scenes = props.scenes, dark = props.dark;
  return e("div", { className: "progress", style: { color: dark ? "var(--char)" : "var(--ink)" } },
    chapters.map(function(c) {
      var sceneIndices = scenes.map(function(s, si) { return s.chapter === c.id ? si : -1; }).filter(function(x) { return x >= 0; });
      if (!sceneIndices.length) return null;
      var minI = sceneIndices[0], maxI = sceneIndices[sceneIndices.length - 1];
      var state = "pending";
      if (idx > maxI) state = "done";
      else if (idx >= minI) state = "active";

      var fillStyle = {};
      if (state === "active") {
        var pct = ((idx - minI + 1) / sceneIndices.length) * 100;
        fillStyle = { width: pct + "%", transition: "width 500ms cubic-bezier(.4,.7,.3,1)" };
      }
      return e("div", { key: c.id, className: "tick" + (dark ? " dark" : "") },
        e("i", { style: state === "done" ? { width: "100%" } : state === "active" ? fillStyle : { width: "0%" } })
      );
    })
  );
}

/* ============ APP ============ */
function App() {
  var ref1 = useState(0), idx = ref1[0], setIdx = ref1[1];
  var ref2 = useState(null), chosenCase = ref2[0], setChosenCase = ref2[1];
  var advanceRef = useRef(null);

  var onChooseCase = useCallback(function(c) { setChosenCase(c); }, []);

  var scenes = useMemo(function() {
    return buildScenes({
      chosenCase: chosenCase || CASES[0],
      onChooseCase: onChooseCase,
      eggs: true,
    });
  }, [chosenCase, onChooseCase]);

  var advance = useCallback(function() { setIdx(function(i) { return Math.min(i + 1, scenes.length - 1); }); }, [scenes.length]);
  var back = useCallback(function() { setIdx(function(i) { return Math.max(0, i - 1); }); }, []);
  advanceRef.current = advance;

  /* Auto-advance */
  useEffect(function() {
    var s = scenes[idx];
    if (!s || !s.auto || s.auto <= 0) return;
    var id = setTimeout(function() { advanceRef.current && advanceRef.current(); }, s.auto);
    return function() { clearTimeout(id); };
  }, [idx, scenes]);

  /* Keyboard */
  useEffect(function() {
    var onKey = function(ev) {
      if (ev.key === "ArrowRight" || ev.key === " ") { advance(); ev.preventDefault(); }
      else if (ev.key === "ArrowLeft") { back(); ev.preventDefault(); }
    };
    window.addEventListener("keydown", onKey);
    return function() { window.removeEventListener("keydown", onKey); };
  }, [advance, back]);

  var currentScene = scenes[idx];
  var currentChapter = currentScene && currentScene.chapter;
  var lightBgChapters = ["chaos", "game"];
  var isDarkText = lightBgChapters.indexOf(currentChapter) >= 0;

  return e(Fragment, null,
    e(ProgressBar, { chapters: CHAPTERS, idx: idx, scenes: scenes, dark: isDarkText }),
    e("div", { style: { position: "absolute", inset: 0 } },
      e("div", { key: idx, style: { position: "absolute", inset: 0 } },
        currentScene && currentScene.render({ advance: advance, back: back })
      )
    ),
    !currentScene || !currentScene.noTapNav ? e(Fragment, null,
      e("div", { className: "tap-zone left", onClick: back }),
      e("div", { className: "tap-zone right", onClick: advance })
    ) : null
  );
}

/* ============ Background Music ============ */
(function() {
  var audio = document.getElementById("bgmusic");
  var btn = document.getElementById("audio-toggle");
  var iconOn = document.getElementById("audio-icon-on");
  var iconOff = document.getElementById("audio-icon-off");
  var started = false;

  audio.volume = 0.4;

  function fadeIn() {
    audio.volume = 0;
    audio.play().then(function() {
      started = true;
      btn.style.display = "grid";
      var vol = 0;
      var fade = setInterval(function() {
        vol = Math.min(vol + 0.02, 0.4);
        audio.volume = vol;
        if (vol >= 0.4) clearInterval(fade);
      }, 50);
    }).catch(function() {});
  }

  /* Start music on first user interaction */
  function startOnce() {
    if (started) return;
    fadeIn();
    document.removeEventListener("click", startOnce);
    document.removeEventListener("touchstart", startOnce);
    document.removeEventListener("keydown", startOnce);
  }
  document.addEventListener("click", startOnce);
  document.addEventListener("touchstart", startOnce);
  document.addEventListener("keydown", startOnce);

  /* Mute toggle */
  btn.addEventListener("click", function(ev) {
    ev.stopPropagation();
    if (audio.muted) {
      audio.muted = false;
      iconOn.style.display = "";
      iconOff.style.display = "none";
    } else {
      audio.muted = true;
      iconOn.style.display = "none";
      iconOff.style.display = "";
    }
  });
})();
